# QS_Robot Pre-Commit 配置
# ===========================
# 安装方式（二选一）:
#   A. 使用 pre-commit 框架:
#      pip install pre-commit ruff --target="D:\Program Files\Python314\Lib\site-packages"
#      pre-commit install
#   B. 使用手动钩子脚本:
#      Copy-Item .git\hooks\pre-commit.ps1 .git\hooks\pre-commit
#
# 依赖: pytest (必需), ruff (可选, 仅 lint hook 需要)
# 注: 2026-10-21 修复钩子路径——原 .venv\Scripts\python.exe 为残缺虚拟环境,
#     改为 Python314 全路径(正斜杠); 内联 -c 脚本迁移至 scripts/hooks/ 下独立文件
# ============================================================
repos:
  - repo: local
    hooks:
      - id: optimizer-mock-test
        name: 优化器Mock单元测试
        entry: '"D:/Program Files/Python314/python.exe" -m pytest tests/test_optimizer_mock_boundary.py -v --tb=short -q'
        language: system
        files: ^(ui/static/js/optimizer_bridge_mock\.js|tests/test_optimizer_mock_boundary\.py)$
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: optimizer-bridge-log-check
        name: 优化器桥接日志完整性检查
        entry: '"D:/Program Files/Python314/python.exe" scripts/hooks/check_bridge_log.py'
        language: system
        files: ^(ui/templates/aurora_main\.html|core/optimizer_bridge_log_analyzer\.py)$
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: strategy-entry-audit
        name: 策略入口审查(22节点)
        entry: '"D:/Program Files/Python314/python.exe" scripts/hooks/check_strategy_audit.py'
        language: system
        files: ^(core/strategy_entry_auditor\.py|api/gateway\.py|core/aurora_core_adapter\.py)$
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: python-lint
        name: Python Lint (ruff - 需 pip install ruff)
        entry: '"D:/Program Files/Python314/python.exe" -m ruff check --select=E9,F821,F811 --ignore=E501,F401'
        language: system
        types: [python]
        stages: [pre-commit]
        verbose: true
        # 若 ruff 未安装，此 hook 会跳过不阻塞提交
