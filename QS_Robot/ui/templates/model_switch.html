<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型切换 - Aurora量化交易系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e1a;
            color: #e8e8e8;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1a2744 0%, #0d1526 100%);
            padding: 12px 30px;
            border-bottom: 2px solid #2a3f5f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 18px;
            font-weight: 600;
            color: #6ba5f7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #8ba3c7;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            background: #1a2744;
        }

        .main-container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section {
            background: #1a2744;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #2a3f5f;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #6ba5f7;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .status-card {
            background: #0d1526;
            border: 1px solid #2a3f5f;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .status-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .status-card.success {
            border-color: rgba(16, 185, 129, 0.3);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), transparent);
        }

        .status-card.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), transparent);
        }

        .status-card.warning {
            border-color: rgba(245, 158, 11, 0.3);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), transparent);
        }

        .status-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-title {
            font-size: 14px;
            color: #8ba3c7;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .status-value {
            font-size: 24px;
            font-weight: 600;
            color: #e8e8e8;
        }

        .status-subtitle {
            font-size: 12px;
            color: #5a6a85;
            margin-top: 4px;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: linear-gradient(135deg, #1a2744 0%, #0d1526 100%);
            border: 2px solid #2a3f5f;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .model-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
        }

        .model-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, #0d1526 100%);
        }

        .model-card.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .model-name {
            font-size: 16px;
            font-weight: 600;
            color: #e8e8e8;
        }

        .model-provider {
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            font-size: 12px;
            color: #667eea;
        }

        .model-description {
            font-size: 13px;
            color: #8ba3c7;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .model-specs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-label {
            font-size: 11px;
            color: #5a6a85;
        }

        .spec-value {
            font-size: 13px;
            color: #e8e8e8;
            font-weight: 500;
        }

        .model-action {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a3f5f;
        }

        .btn-select {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-select.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-select.active:hover {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .provider-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a3f5f;
        }

        .provider-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #8ba3c7;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px 4px 0 0;
        }

        .provider-tab:hover {
            color: #e8e8e8;
        }

        .provider-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .config-section {
            background: #0d1526;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .config-title {
            font-size: 14px;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 15px;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .config-label {
            font-size: 13px;
            color: #8ba3c7;
        }

        .config-input {
            background: #1a2744;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e8e8e8;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .config-input:focus {
            border-color: #667eea;
        }

        .config-switch {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .switch-label {
            font-size: 13px;
            color: #8ba3c7;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2a3f5f;
            transition: 0.3s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .btn-config {
            padding: 10px 24px;
            background: #2a3f5f;
            border: none;
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-config:hover {
            background: #3a5a8f;
        }

        .btn-config.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-config.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: #1a2744;
            border: 1px solid #2a3f5f;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), #1a2744);
        }

        .toast.error {
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), #1a2744);
        }

        .toast-message {
            font-size: 14px;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .config-row { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/main_system" style="color: #e8e8f0; text-decoration: none; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <span>🎯</span>
            <span>Aurora 量化</span>
        </a>
        <div class="nav-links">
            <a href="/dashboard">🏠 控制台</a>
            <a href="/aurora_main">🚀 Aurora主系统</a>
            <a href="/main_system">⚙️ QS-Robot外壳</a>
            <a href="/stock_pool">📈 股票池</a>
            <a href="/technical_analysis">📊 技术分析</a>
            <a href="/vibe_analysis">🧠 Vibe智能体</a>
            <a href="/cline-agent">🤖 Cline智能体</a>
            <a href="/model-switch" class="active">🔄 模型切换</a>
            <a href="/chat">💬 智能助手</a>
            <a href="/maintenance">🔧 系统维护</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="section">
            <div class="section-title">系统状态概览</div>
            <div class="status-cards">
                <div class="status-card success">
                    <div class="status-header-row">
                        <span class="status-title">当前模型</span>
                        <div class="status-dot online"></div>
                    </div>
                    <div class="status-value" id="currentModelValue">GPT-4o</div>
                    <div class="status-subtitle" id="currentProviderSubtitle">通过 EchoBird 提供</div>
                </div>
                <div class="status-card success">
                    <div class="status-header-row">
                        <span class="status-title">EchoBird 服务</span>
                        <div class="status-dot" id="echobirdStatusDot"></div>
                    </div>
                    <div class="status-value" id="echobirdStatusValue">检测中</div>
                    <div class="status-subtitle">API: localhost:8080</div>
                </div>
                <div class="status-card success">
                    <div class="status-header-row">
                        <span class="status-title">Ollama 本地</span>
                        <div class="status-dot" id="ollamaStatusDot"></div>
                    </div>
                    <div class="status-value" id="ollamaStatusValue">检测中</div>
                    <div class="status-subtitle">API: localhost:11434</div>
                </div>
                <div class="status-card success">
                    <div class="status-header-row">
                        <span class="status-title">Cline 智能体</span>
                        <div class="status-dot" id="clineStatusDot"></div>
                    </div>
                    <div class="status-value" id="clineStatusValue">检测中</div>
                    <div class="status-subtitle">CLI 智能体通道</div>
                </div>
                <div class="status-card">
                    <div class="status-header-row">
                        <span class="status-title">可用模型</span>
                        <div class="status-dot online"></div>
                    </div>
                    <div class="status-value" id="modelCount">0</div>
                    <div class="status-subtitle">个模型可供选择</div>
                </div>
                <div class="status-card">
                    <div class="status-header-row">
                        <span class="status-title">自动切换</span>
                        <div class="status-dot" id="autoSwitchStatus"></div>
                    </div>
                    <div class="status-value" id="autoSwitchValue">关闭</div>
                    <div class="status-subtitle">根据任务自动选择模型</div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">模型选择</div>
            <div class="provider-tabs">
                <button class="provider-tab active" data-provider="all" onclick="filterModels('all')">全部</button>
                <button class="provider-tab" data-provider="echobird" onclick="filterModels('echobird')">🐦 EchoBird</button>
                <button class="provider-tab" data-provider="ollama" onclick="filterModels('ollama')">🦙 Ollama</button>
                <button class="provider-tab" data-provider="cline" onclick="filterModels('cline')">🤖 Cline</button>
            </div>
            <div class="model-grid" id="modelGrid">
            </div>
        </div>

        <div class="section">
            <div class="section-title">切换配置</div>
            <div class="config-section">
                <div class="config-title">自动切换设置</div>
                <div class="config-row">
                    <div class="config-item">
                        <label class="config-label">启用自动切换</label>
                        <div class="config-switch">
                            <span class="switch-label">根据任务类型自动选择最优模型</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="autoSwitchToggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-item">
                        <label class="config-label">量化任务默认模型</label>
                        <select class="config-input" id="quantModel">
                            <option value="">请选择...</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label class="config-label">代码任务默认模型</label>
                        <select class="config-input" id="codeModel">
                            <option value="">请选择...</option>
                        </select>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn-config" onclick="resetConfig()">重置配置</button>
                    <button class="btn-config primary" onclick="saveConfig()">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <script>
        let models = [];
        let currentProvider = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            loadModels();
            loadConfig();
        });

        async function loadModels() {
            try {
                const response = await fetch('/api/llm/models');
                const data = await response.json();

                if (data.success && data.models) {
                    models = data.models;
                    document.getElementById('modelCount').textContent = models.length;
                    document.getElementById('currentModelValue').textContent = data.current_model || '未设置';
                    document.getElementById('currentProviderSubtitle').textContent =
                        '通过 ' + (data.current_provider || data.provider || 'EchoBird') + ' 提供';

                    // 更新三个 provider 状态卡片
                    const ps = data.providers_status || {};
                    updateProviderCard('echobird', ps.echobird);
                    updateProviderCard('ollama', ps.ollama);
                    updateProviderCard('cline', ps.cline);

                    renderModels();
                    populateModelSelects();
                }
            } catch (error) {
                console.error('加载模型失败:', error);
                showToast('加载模型列表失败', 'error');
            }
        }

        function updateProviderCard(name, info) {
            const dot = document.getElementById(name + 'StatusDot');
            const val = document.getElementById(name + 'StatusValue');
            if (!dot || !val) return;
            const ok = info && info.available;
            dot.className = 'status-dot ' + (ok ? 'online' : 'offline');
            val.textContent = ok ? ('已连接 · ' + (info.model || '-')) : '未连接';
        }

        function renderModels() {
            const grid = document.getElementById('modelGrid');
            grid.innerHTML = '';
            
            const filteredModels = currentProvider === 'all' 
                ? models 
                : models.filter(m => m.provider.toLowerCase() === currentProvider.toLowerCase());
            
            if (filteredModels.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #8ba3c7;">
                        暂无可用模型
                    </div>
                `;
                return;
            }
            
            filteredModels.forEach(model => {
                const card = document.createElement('div');
                card.className = `model-card ${model.is_active ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="model-header">
                        <div class="model-name">${model.name}</div>
                        <div class="model-provider">${model.provider}</div>
                    </div>
                    <div class="model-description">${model.description || '暂无描述'}</div>
                    <div class="model-specs">
                        <div class="spec-item">
                            <span class="spec-label">上下文</span>
                            <span class="spec-value">${model.context || '-'}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">性能</span>
                            <span class="spec-value">${model.performance || '-'}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">价格</span>
                            <span class="spec-value">${model.price || '-'}</span>
                        </div>
                    </div>
                    <div class="model-action">
                        <button class="btn-select ${model.is_active ? 'active' : ''}" onclick="selectModel('${model.name}')">
                            ${model.is_active ? '✓ 当前模型' : '选择此模型'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterModels(provider) {
            currentProvider = provider;
            document.querySelectorAll('.provider-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`[data-provider="${provider}"]`).classList.add('active');
            renderModels();
        }

        function populateModelSelects() {
            const quantSelect = document.getElementById('quantModel');
            const codeSelect = document.getElementById('codeModel');
            
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model.name;
                option.textContent = model.name;
                quantSelect.appendChild(option.cloneNode(true));
                codeSelect.appendChild(option);
            });
        }

        async function selectModel(modelName) {
            try {
                const response = await fetch('/api/llm/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: modelName })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('currentModelValue').textContent = modelName;
                    showToast(`已成功切换到: ${modelName}`, 'success');
                    loadModels();
                } else {
                    showToast(data.error || '切换失败', 'error');
                }
            } catch (error) {
                showToast('切换失败: ' + error.message, 'error');
            }
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/llm/config');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('autoSwitchToggle').checked = data.auto_switch || false;
                    document.getElementById('quantModel').value = data.quant_model || '';
                    document.getElementById('codeModel').value = data.code_model || '';
                    
                    updateAutoSwitchStatus(data.auto_switch);
                }
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        function updateAutoSwitchStatus(enabled) {
            const statusDot = document.getElementById('autoSwitchStatus');
            const statusValue = document.getElementById('autoSwitchValue');
            
            if (enabled) {
                statusDot.className = 'status-dot online';
                statusValue.textContent = '开启';
            } else {
                statusDot.className = 'status-dot offline';
                statusValue.textContent = '关闭';
            }
        }

        async function saveConfig() {
            try {
                const config = {
                    auto_switch: document.getElementById('autoSwitchToggle').checked,
                    quant_model: document.getElementById('quantModel').value,
                    code_model: document.getElementById('codeModel').value
                };
                
                const response = await fetch('/api/llm/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('配置已保存', 'success');
                    updateAutoSwitchStatus(config.auto_switch);
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch (error) {
                showToast('保存失败: ' + error.message, 'error');
            }
        }

        function resetConfig() {
            document.getElementById('autoSwitchToggle').checked = false;
            document.getElementById('quantModel').value = '';
            document.getElementById('codeModel').value = '';
            updateAutoSwitchStatus(false);
            showToast('配置已重置', 'success');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.className = `toast show ${type}`;
            toastMessage.innerHTML = type === 'success' ? `✓ ${message}` : `✗ ${message}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('autoSwitchToggle').addEventListener('change', (e) => {
            updateAutoSwitchStatus(e.target.checked);
        });
    </script>
    <script src="/static/robot-widget.js"></script>
</body>
</html>
